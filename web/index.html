/* TX mobile design */
.app>.main{margin:0 auto;align-self:stretch}
.tx-page{max-width:1040px;width:100%}
.tx-tools{display:flex;flex-direction:column;gap:13px;margin-bottom:20px}
.tx-search{display:flex;align-items:center;gap:10px;width:100%;height:47px;border:1px solid #e1e9e0;border-radius:13px;background:white;padding:0 14px;box-shadow:0 2px 8px #123d3007;color:#829489}
.tx-search svg{width:18px;height:18px}
.tx-search input{border:0;outline:0;min-width:0;flex:1;background:transparent;color:var(--ink);font-size:14px;height:100%}
.tx-search input::placeholder{color:#9aa89d}
.tx-filters{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:none;padding:1px 1px 5px;-webkit-overflow-scrolling:touch}
.tx-filters::-webkit-scrollbar{display:none}
.tx-chip{border:1px solid #e2e9e0;background:#fff;color:#748579;white-space:nowrap;border-radius:999px;padding:9px 13px;font-weight:690;font-size:12px;min-height:36px;display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
.tx-chip span{font-size:10px;color:#91a397;background:#edf3ee;border-radius:99px;min-width:19px;padding:2px 5px;text-align:center}
.tx-chip.active{background:var(--pine);border-color:var(--pine);color:#fff}
.tx-chip.active span{background:#ffffff26;color:#fff}
.tx-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#829085;margin:0 1px 10px}
.tx-list-head strong{font-size:12px;color:#63766b;font-weight:750}
.tx-list-head small{font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tx-list{display:grid;gap:9px}
.tx-entry{border:1px solid #e8eee7;border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:white;box-shadow:0 3px 14px #173b2b07;color:var(--ink)}
.tx-entry:hover{border-color:#c6dccb;background:#fbfdfa}
.tx-entry-icon{display:grid;place-items:center;width:40px;height:40px;background:#edf4ec;color:#286647;border-radius:13px;flex:none}
.tx-entry-icon svg{width:18px;height:18px}
.tx-entry-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.tx-entry-info strong{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-entry-info small{font-size:11px;color:#8c9a90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sep{margin:0 3px}
.tx-entry-info .tx-payee{color:#a0ada3}
.tx-entry-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;min-width:112px;max-width:42%;text-align:right}
.tx-entry-right>strong{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.tx-entry-right .badge{font-size:10px;padding:5px 9px}
.tx-empty{display:flex;align-items:center;flex-direction:column;text-align:center;padding:38px 22px 31px;max-width:500px;margin:2px auto 0}
.tx-empty-icon{height:59px;width:59px;border-radius:19px;display:grid;place-items:center;background:#e8f1e7;color:var(--pine);margin-bottom:17px}
.tx-empty-icon svg{width:26px;height:26px}
.tx-empty strong{font-size:17px;letter-spacing:-.35px;color:#243b2f}
.tx-empty p{font-size:12px;line-height:1.6;color:#839588;margin:8px 0 19px;max-width:270px}
.tx-empty .btn{min-height:43px;padding:11px 18px}

const api=async(path,data)=>{let opt=data===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)};let r=await fetch('/api/'+path,opt),v=await r.json().catch(()=>({error:'Unexpected response'}));if(!r.ok)throw new Error(v.error||'Request failed');return v;};

function mobile(){
 const g=group();
 const items=[['overview','grid','Home'],['treasury','wallet','Treasury'],['expenses','receipt','Expenses'],['reports','pie','Reports']];
 return '<div class="mobile-top"><div class="mobile-top-inner"><button type="button" class="mobile-workspace" data-modal="switchgroup" aria-label="Switch workspace"><span class="mobile-workspace-icon">'+ico(wsIcon(g?.icon))+'</span><span class="mobile-workspace-text"><small>WORKSPACE</small><strong>'+esc(g?.name||'Omni Ledger')+'</strong></span>'+ico('down')+'</button><div class="mobile-controls"><button type="button" class="lang-switcher mobile-language" data-language aria-label="Switch language"><span class="'+(S.lang==='en'?'current':'')+'">EN</span><span class="lang-divider">/</span><span class="'+(S.lang==='fr'?'current':'')+'">FR</span></button><button type="button" class="round mobile-more" data-modal="more" aria-label="More">'+ico('menu')+'</button></div></div></div>'

function heading(sub){return '<div class="header"><div class="crumb">Workspaces / <strong>'+esc(group()?.name||'')+'</strong> / '+esc(titleFor(S.page))+'</div><div class="actions"><span style="color:#8b998e;font-size:12px">'+niceDate(new Date().toISOString())+'</span><span class="avatar">'+esc(S.user.name[0]||'M')+'</span></div></div><div class="headline"><div><h1>'+titleFor(S.page)+'</h1><p>'+sub+'</p></div><div class="actions">'+(S.page==='reports'?'<button class="btn" data-action="csv">'+ico('download')+' Export CSV</button>':'')+(can('editor')&&['overview','expenses','requests','commitments'].includes(S.page)?'<button class="btn primary" data-modal="quick">'+ico('plus')+' New record</button>':'')+'</div></div>';}
function overview(){let ex=records('expenses'),paid=ex.filter(x=>x.status==='paid'&&x.expense_date.slice(0,7)===S.month),pending=ex.filter(x=>x.status==='pending'),approved=ex.filter(x=>x.status==='approved'),spend=paid.reduce((s,x)=>s+x.amount_cents,0),due=records('commitments').filter(x=>x.active),need=records('requests').filter(x=>x.status==='waiting'||x.status==='approved');

return heading('Your workspace at a glance · '+monthLabel(S.month))+treasurySummary()+'<div class="dashboard-grid"><div class="hero-card"><div class="tiny"><span class="frost">'+ico('wallet')+'</span> Total paid this month</div><div class="money">'+fmt(spend)+' <small>'+esc(group()?.currency||'TND')+'</small></div><div class="footer">'+ico('shield')+' <strong>Verified payments only</strong> · '+paid.length+' recorded</div></div><div class="stat"><div class="stat-top"><small>Awaiting approval</small><span class="iconbox">'+ico('clock')+'</span></div><h2>'+pending.length+'</h2><footer><strong>'+mon(pending.reduce((s,x)=>s+x.amount_cents,0))+'</strong> submitted</footer></div><div class="stat"><div class="stat-top"><small>Approved, not paid</small><span class="iconbox">'+ico('check')+'</span></div><h2>'+mon(approved.reduce((s,x)=>s+x.amount_cents,0))+'</h2><footer>'+approved.length+' awaiting confirmation</footer></div></div>'+

'<section class="panel"><div class="panel-head"><h3>Requests & queue</h3><button class="link" data-page="requests">See requests '+ico('arrow')+'</button></div>'+ (need.length?need.slice(0,3).map(x=>'<div class="item"><span class="itemico">'+ico('file')+'</span><div class="itemmain"><b>'+esc(x.title)+'</b><small>'+esc(x.priority)+' priority · '+niceDate(x.due_date)+'</small></div><div>'+pill(x.status)+'</div></div>').join(''):empty('All caught up','Add planned purchases or requests, approve them and link them to expenses.','file'))+'</section></div><div class="callout">'+ico('shield')+'<span><b>Clear records, better decisions.</b> Paid transactions count towards spending. Requests and approvals remain separate until payment.</span></div>';

const palette=['#153d32','#287f5a','#82b49a','#accdb9','#d1e1cf','#e8f0e4'];
function breakdown(paid){let map={};paid.forEach(x=>map[x.category]=(map[x.category]||0)+x.amount_cents);return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);}

 const noResults='<div class="tx-empty tx-no-results"><span class="tx-empty-icon">'+ico('search')+'</span><strong>No matching transactions</strong><p>Try another search or status.</p><button class="btn soft small" type="button" data-action="txClear">Clear filters</button></div>';

function expensesPage(){
 const all=records('expenses');

async function downloadReport(){
 const from=document.getElementById('pdfFrom')?.value||'2020-01-01',to=document.getElementById('pdfTo')?.value||new Date().toISOString().slice(0,10),status=document.getElementById('pdfStatus')?.value||'all';
 if(from>to){flash(t('Choose a valid date range.'),true);return;}
 const params=new URLSearchParams({group_id:S.groupId,from,to,status,lang:S.lang||'en'});
 if(document.getElementById('pdfPrivate')?.checked&&can('controller'))params.set('private','1');
 try{
  const response=await fetch('/api/report/pdf?'+params,{credentials:'same-origin'});
  if(!response.ok){const v=await response.json().catch(()=>({error:'Report could not be generated'}));throw new Error(v.error||'Report could not be generated');}
  const blob=await response.blob();
  if(blob.size<150)throw new Error('Invalid PDF document');
  const href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download='GSC-Ledger-'+from+'-'+to+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),30000);
  flash(t('PDF report downloaded'));
 }catch(error){flash(error.message,true);}
}

function detail(kind,id){let x=records(kind==='expense'?'expenses':'requests').find(x=>x.id===id);if(!x)return;let info=kind==='expense'?[['Title',x.title],['Amount',mon(x.amount_cents)],['Status',x.status],['Date',niceDate(x.expense_date)],['Category',x.category],['Payee / recipient',x.beneficiary],['Payment method',x.method],['Submitted by',x.creator],['Reference',x.reference],['Notes',x.notes]]:[['Title',x.title],['Status',x.status]];

function csv(){let columns=['expense_date','title','category','beneficiary','amount','currency','status','method','reference','notes','receipt_url','creator','approved_at'];let items=records('expenses');let row=x=>{let t=String(x??'');if(/^[=+\-@]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"';};let content=[columns.join(','),...items.map(e=>columns.map(c=>row(c==='amount'?(e.amount_cents/100).toFixed(2):e[c])).join(','))].join('\r\n');let blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(group()?.name||'ledger').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-expenses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function authRender(){let signup=S.auth==='signup',first=S.setup,inv=S.inviteInfo;root.innerHTML='<div class="auth"><div class="authvisual"><div class="branding"><span class="brand-icon"><img class=\"gsc-mark\" src=\"/app-icon-192.png\" alt=\"\"></span> GSC Ledger</div><h1>Every expense.<br><em>In its place.</em></h1><p>Manage spending, requests, recurring bills and reports across all your workspaces — from offices and projects to shared budgets.</p><footer>Your workspaces. Your team. Your overview.</footer></div><div class="authright"><div class="authcard"><div class="auth-tag">'+ico('shield')+' ORGANIZED FINANCES, TOGETHER</div><h2>'+(signup?'Create your account':'Welcome back')+'</h2><p>'+(signup?(first?'Set up the first administrator account for your workspace.':'You have been invited to collaborate with '+esc(inv?.group_name||'a group')+'.'):'Sign in to manage expenses, requests and reports across your workspaces.')+'</p><form id="authForm">'+(signup?formInput('name','Full name','text','','required autocomplete="name"'):'')+formInput('email','Email address','email',inv?.email||'','required autocomplete="email"')+formInput('password','Password','password','','required minlength="12" autocomplete="'+(signup?'new-password':'current-password')+'"')+(signup&&first?formInput('setupKey','Private setup key','password','','required'): '')+'<button class="btn primary" type="submit">'+(signup?'Create my account':'Sign in')+' '+ico('arrow')+'</button></form><div class="swap">'+((S.setup||S.inviteInfo)?((signup?'Already registered? ':'Have an invitation? ')+'<button id="authSwitch">'+(signup?'Sign in':'Create account')+'</button>'):'New here? Ask a workspace owner for a private invitation.')+'</div>'+(S.invite&&!signup?'<div class="callout" style="margin-top:20px"><span>Invitation detected. Sign in with the invited email to accept access.</span></div>':'')+'</div></div></div>';}
async function init(){try{let a=await api('bootstrap');S.setup=a.needsSetup;if(S.invite){try{S.inviteInfo=await api('invite/lookup?token='+encodeURIComponent(S.invite));}catch(e){S.inviteInfo=null;}}try{await refresh(true);if(S.invite){try{await api('invite/accept',{token:S.invite});history.replaceState(null,'','/');await refresh();flash('Invitation accepted');}catch(e){flash(e.message,true);}}}catch(e){S.auth=(S.setup||S.inviteInfo)?'signup':'login';authRender();}}catch(e){root.innerHTML='<div class="authright"><div class="authcard"><h2>Connection unavailable</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Retry</button></div></div>';}}

function t(s){return S.lang==='fr'?(FR[String(s)]||String(s)):String(s);}
function localizedText(value){
 const original=String(value),trimmed=original.trim();
 if(!trimmed)return original;
 let translated=t(trimmed);
 if(S.lang==='fr'&&translated===trimmed){
  translated=trimmed
   .replace(/^A clear view of the care you provide · /,'Une vue claire de votre engagement · ')
   .replace(/^Due /,'Échéance : ')
   .replace(/^Needed /,'Demandé pour le ')
   .replace(/^Next due: /,'Prochaine échéance : ')
   .replace(/^(\d+) recorded$/,'$1 enregistrés')
   .replace(/^(\d+) awaiting confirmation$/,'$1 en attente de confirmation')
   .replace(/^(\d+) confirmed payments · (\d+) categories$/,'$1 paiements confirmés · $2 catégories')
   .replace(/^(\d+) events$/,'$1 événements')
   .replace(/^(\d+) confirmed payments$/,'$1 paiements confirmés')
   .replace(/^Invitee /,'Invité : ')
   .replace(/^You have been invited to collaborate with (.*)\.$/,'Vous avez été invité à collaborer avec $1.')
   .replace(/^Workspaces \/ /,'Espaces / ')
   .replace(/^You have /,'Vous avez ')
   .replace(/ · ([0-9]+) recorded$/,' · $1 enregistrés')
   .replace(/ · ([0-9]+) categories$/,' · $1 catégories')
   .replace(/\b(\d+) awaiting confirmation\b/,'$1 en attente de confirmation');
  for(const a of ['Food','Housing','Support','Health','Education','Transport','Utilities','Giving','Cash','Bank transfer','Card','Other']){
   if(translated===a)translated=FR[a];
  }
 }
 return original.replace(trimmed,translated);
}
function localizeElement(container){
 if(!container)return;
 document.documentElement.lang=S.lang;
 if(S.lang!=='fr')return;
 const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
 const nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  const parent=node.parentElement;
  if(!parent||parent.closest('script,style,textarea,option[data-skip-translation],[contenteditable="true"]'))continue;
  const translated=localizedText(node.nodeValue);
  if(translated!==node.nodeValue)node.nodeValue=translated;
 }
 for(const el of container.querySelectorAll('[placeholder],[aria-label],[title]')){
   for(const attr of ['placeholder','aria-label','title']){
     if(!el.hasAttribute(attr))continue;
     const original=el.getAttribute(attr);
     const localized=localizedText(original);
     if(original!==localized)el.setAttribute(attr,localized);
   }
 }
}
function langMarkup(){return '<button type="button" class="lang-switcher" data-language aria-label="'+t('Switch language')+'"><span class="'+(S.lang==='en'?'current':'')+'">EN</span><span class="lang-divider">/</span><span class="'+(S.lang==='fr'?'current':'')+'">FR</span></button>';}
function applyLocalization(){
 if(S.data){
  let sideFooter=root.querySelector('.sidefooter');
  if(sideFooter&&!sideFooter.querySelector('.side-lang'))sideFooter.insertAdjacentHTML('afterbegin','<div class="side-lang"><span class="side-lang-label">'+t('Language')+'</span>'+langMarkup()+'</div>');
 }else{
  let authCard=root.querySelector('.authcard');
  if(authCard&&!authCard.querySelector('.auth-lang'))authCard.insertAdjacentHTML('afterbegin','<div class="auth-lang">'+langMarkup()+'</div>');
 }
 localizeElement(root);localizeElement(modalRoot);localizeElement(toastBox);
}
const localizationObserver=new MutationObserver(()=>applyLocalization());
localizationObserver.observe(root,{childList:true,subtree:true});
localizationObserver.observe(modalRoot,{childList:true,subtree:true});
localizationObserver.observe(toastBox,{childList:true,subtree:true});

 if(!gscTour.active)return;
 gscTour.index=Math.min(Math.max(0,i),gscTour.steps.length-1);
 const p=gscTour.steps[gscTour.index].page;
 if(S.page!==p){S.page=p;closeModal();render();}
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  tourPosition();
  gscTour.layer?.querySelector('.gsc-tour-next')?.focus({preventScroll:true});
 }));
}
function tourEnd(){
 if(!gscTour.active)return;
 gscTour.active=false;
 gscTour.layer?.remove();gscTour.layer=null;
 window.removeEventListener('resize',tourPosition);
 window.removeEventListener('scroll',tourPosition,true);
 root.inert=false;
 S.page=gscTour.original;
 render();
 api('onboarding/complete',{}).catch(e=>console.warn('Walkthrough save failed',e));
}
function tourStart(){
 if(!S.data||gscTour.active)return;
 closeModal();
 gscTour.original=S.page;gscTour.steps=tourSteps();gscTour.active=true;
 const layer=document.createElement('div');
 layer.className='gsc-tour-layer';layer.id='gsc-tour-layer';
 layer.innerHTML='<div class="gsc-tour-blocker"></div><div class="gsc-tour-spotlight"></div><section class="gsc-tour-card" role="dialog" aria-modal="true" aria-labelledby="gsc-tour-title" aria-describedby="gsc-tour-desc"></section>';
 layer.addEventListener('click',e=>{
  const a=e.target.closest('[data-tour]')?.dataset.tour;
  if(a==='next')tourStep(gscTour.index+1);
  if(a==='back')tourStep(gscTour.index-1);
  if(a==='finish'||a==='skip')tourEnd();
  if(a==='language'){
   S.lang=S.lang==='en'?'fr':'en';
   try{localStorage.setItem('mercy-ledger-language',S.lang);}catch(err){}
   render();tourPosition();
  }
 });
 document.body.appendChild(layer);gscTour.layer=layer;
 root.inert=true;
 window.addEventListener('resize',tourPosition);
 window.addEventListener('scroll',tourPosition,true);
 tourStep(0);
}
async function maybeStartTour(){
 if(gscTour.checked||!S.data)return;
 gscTour.checked=true;
 try{
  const info=await api('onboarding');
  if(!info.completed&&S.data&&!gscTour.active)setTimeout(()=>{if(S.data&&!gscTour.active)tourStart();},400);
 }catch(e){gscTour.checked=false;console.warn('Tour preference unavailable',e);}
}
document.addEventListener('keydown',e=>{
 if(!gscTour.active)return;
 if(e.key==='Escape'){e.preventDefault();tourEnd();}
 else if(e.key==='ArrowRight'){e.preventDefault();tourStep(gscTour.index+1);}
 else if(e.key==='ArrowLeft'){e.preventDefault();tourStep(gscTour.index-1);}
 else if(e.key==='Tab'){
  const controls=[...gscTour.layer.querySelectorAll('button')],first=controls[0],last=controls[controls.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});

init();
})();
</script></body></html>
